[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estonia-nordpool-prices"
version = "0.3.0"
description = "CLI and MCP server for Estonia's current and next-day Nord Pool prices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
]

[project.scripts]
nordpool-ee = "nordpool_ee:main"
nordpool-ee-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["nordpool_ee", "mcp_server"]
